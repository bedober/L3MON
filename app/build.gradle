plugins {
    id 'com.android.application'
}

android {
    namespace 'com.l3mon.vulnscanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.l3mon.vulnscanner'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'io.socket:socket.io-client:2.1.0'
}
